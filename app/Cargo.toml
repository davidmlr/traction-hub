[package]
edition = "2021"
name = "app"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-futures = "0.1.2"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"]}
embassy-stm32 = { version = "0.6.0", features = ["memory-x", "stm32g431cb", "time-driver-any", "exti", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-usb = { version = "0.6.0" }
heapless = "0.9"
postcard = { version = "1", default-features = false }
static_cell = "2"
protocol = { path = "../protocol" }

[[bin]]
name = "app"
test = false
bench = false

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true

[features]
defmt = ["dep:defmt"]
defmt-rtt = ["dep:defmt-rtt"]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
    "embassy-usb/defmt",
]
