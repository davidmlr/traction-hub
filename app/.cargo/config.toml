[target.thumbv7em-none-eabi]
# no-catch-hardfault: let our HardFault handler run and report
runner = 'probe-rs run --chip STM32G431CBTx --no-catch-hardfault'

[build]
target = "thumbv7em-none-eabi"

[env]
DEFMT_LOG = "info"
#DEFMT_LOG = "trace"

[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]
